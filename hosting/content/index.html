<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BilgiliMedia İçerik</title>
  <meta name="description" content="BilgiliMedia kısa okuma">
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f7f8fb;color:#191b1f}
    main{max-width:760px;margin:0 auto;padding:28px 18px 56px}.brand{color:#e11f30;font-size:13px;font-weight:900;letter-spacing:.12em}
    .card{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .cat{color:#e11f30;font-size:12px;font-weight:800;text-transform:uppercase}h1{font-size:32px;line-height:1.12;margin:9px 0}
    .summary{font-size:17px;color:#626975;line-height:1.55}.body{font-size:17px;line-height:1.72;margin-top:24px}
    a{color:#e11f30;font-weight:700}.muted{color:#7a818a}
  </style>
</head>
<body>
<main>
  <div class="brand">BİLGİLİMEDIA</div>
  <section class="card" id="content">
    <p class="muted">İçerik yükleniyor…</p>
  </section>
</main>
<script>
const FEED="/feed.json";
const parts=location.pathname.split("/").filter(Boolean);
const id=parts[0]==="content"&&parts[1]?decodeURIComponent(parts[1]):new URLSearchParams(location.search).get("id");
const root=document.getElementById("content");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
(async()=>{
  try{
    const feed=await fetch(FEED,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()});
    const a=feed.articles.find(x=>String(x.id)===String(id));
    if(!a){root.innerHTML='<h1>İçerik bulunamadı</h1><p class="muted">Bağlantı güncel olmayabilir.</p>';return;}
    document.title=a.title+" • BilgiliMedia";
    root.innerHTML='<div class="cat">'+esc(a.category)+' • '+esc(a.minutes)+' dk okuma</div>'+
      '<h1>'+esc(a.title)+'</h1><p class="summary">'+esc(a.summary)+'</p>'+
      '<div class="body">'+esc(a.body)+'</div>'+
      '<p><a href="https://spoo.me/bilgilimedia">BilgiliMedia hesapları</a></p>';
  }catch(e){
    root.innerHTML='<h1>İçerik yüklenemedi</h1><p class="muted">İnternet bağlantını kontrol edip tekrar deneyebilirsin.</p>';
  }
})();
</script>
</body>
</html>
