name: Deploy Firebase Hosting

on:
  push:
    paths:
      - "hosting/**"
      - "state/known.json"
      - "firebase.json"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Firebase secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi

      - name: Prepare Google credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Snapshot live content for web fallback
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://superjsonblob.com/api/jsonBlob/075eca5d-5acd-49fe-87ba-579a4c6ab434" \
            -o hosting/feed.json
          node -e "const f=require('./hosting/feed.json'); if(!Array.isArray(f.articles)||f.articles.length<1) process.exit(1); console.log('Web feed snapshot:', f.version, f.articles.length)"

      - name: Build static article pages
        run: node scripts/build-web-content.js

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx --yes firebase-tools@latest deploy --only hosting --project bilgilimedia-60d6f --non-interactive
