name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "content/feed.json"
      - "hosting/**"
      - "firebase.json"
      - "scripts/build-web-content.js"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-hosting:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/190776938532/locations/global/workloadIdentityPools/github-actions/providers/bilgilimedia-push
          service_account: firebase-adminsdk-fbsvc@bilgilimedia-60d6f.iam.gserviceaccount.com
          project_id: bilgilimedia-60d6f

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish repository content feed
        shell: bash
        run: |
          cp content/feed.json hosting/feed.json
          node -e "const f=require('./hosting/feed.json'); if(!Array.isArray(f.articles)||f.articles.length<1) process.exit(1); console.log('Publishing feed:', f.version, f.articles.length)"

      - name: Build static article pages
        run: node scripts/build-web-content.js

      - name: Deploy Firebase Hosting
        run: |
          npx --yes firebase-tools@latest deploy --only hosting --project bilgilimedia-60d6f --non-interactive
