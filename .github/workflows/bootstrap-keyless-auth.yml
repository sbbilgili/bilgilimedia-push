name: Bootstrap Keyless Google Auth

on:
  push:
    paths:
      - ".github/workflows/bootstrap-keyless-auth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with existing one-time key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Create restricted GitHub Workload Identity provider
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID="bilgilimedia-60d6f"
          PROJECT_NUMBER="190776938532"
          POOL_ID="github-actions"
          PROVIDER_ID="bilgilimedia-push"
          SA_EMAIL="firebase-adminsdk-fbsvc@bilgilimedia-60d6f.iam.gserviceaccount.com"
          REPO="sbbilgili/bilgilimedia-push"

          if ! gcloud iam workload-identity-pools describe "$POOL_ID" --project="$PROJECT_ID" --location="global" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools create "$POOL_ID" \
              --project="$PROJECT_ID" \
              --location="global" \
              --display-name="BilgiliMedia GitHub Actions"
          fi

          if ! gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" --project="$PROJECT_ID" --location="global" --workload-identity-pool="$POOL_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools providers create-oidc "$PROVIDER_ID" \
              --project="$PROJECT_ID" \
              --location="global" \
              --workload-identity-pool="$POOL_ID" \
              --display-name="BilgiliMedia repository" \
              --issuer-uri="https://token.actions.githubusercontent.com" \
              --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.ref=assertion.ref,attribute.actor=assertion.actor" \
              --attribute-condition="assertion.repository=='$REPO' && assertion.ref=='refs/heads/main'"
          fi

          POOL_NAME="projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL_ID"
          PROVIDER_NAME="$POOL_NAME/providers/$PROVIDER_ID"
          PRINCIPAL="principalSet://iam.googleapis.com/$POOL_NAME/attribute.repository/$REPO"

          gcloud iam service-accounts add-iam-policy-binding "$SA_EMAIL" \
            --project="$PROJECT_ID" \
            --role="roles/iam.workloadIdentityUser" \
            --member="$PRINCIPAL"

          mkdir -p state
          cat > state/keyless-auth.json <<EOF
          {
            "projectId": "$PROJECT_ID",
            "projectNumber": "$PROJECT_NUMBER",
            "workloadIdentityProvider": "$PROVIDER_NAME",
            "serviceAccount": "$SA_EMAIL",
            "repository": "$REPO",
            "branch": "refs/heads/main"
          }
          EOF

      - name: Save keyless auth configuration
        shell: bash
        run: |
          git config user.name "BilgiliMedia Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/keyless-auth.json
          if git diff --cached --quiet; then
            echo "No keyless auth state change."
            exit 0
          fi
          git commit -m "Record keyless GitHub authentication configuration"
          git push
