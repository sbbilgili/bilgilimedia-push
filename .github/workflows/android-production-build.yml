name: Build Android Production Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - "android-production/**"
      - "content/feed.json"
      - "hosting/app-config.json"
      - "scripts/validate-android-source.js"
      - ".github/workflows/android-production-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Android parity + lint + build + artifact audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate golden and hardened source contracts
        run: node scripts/validate-android-source.js

      - name: Reject tracked signing/private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(jks|keystore|p12|pfx)$|(^|/)service-account.*\.json$|(^|/)google-services-production\.json$'; then
            echo "Forbidden signing or service-account material is tracked."
            exit 1
          fi
          if git grep -nE -- '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----' -- .; then
            echo "Private key material detected."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 and official ELF audit tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platforms;android-36"             "build-tools;35.0.0"             "ndk;28.0.12433566"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Prepare offline content fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-production/app/src/main/assets
          cp content/feed.json android-production/app/src/main/assets/feed.json
          cp hosting/app-config.json android-production/app/src/main/assets/app-config.json

      - name: Lint and build QA/release artifacts
        working-directory: android-production
        run: |
          gradle --no-daemon clean \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Audit generated APK/AAB
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="android-production/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$(find android-production/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          RELEASE_AAB="android-production/app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          unzip -t "$DEBUG_APK" >/dev/null
          unzip -t "$RELEASE_APK" >/dev/null
          unzip -t "$RELEASE_AAB" >/dev/null

          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          LLVM_OBJDUMP="$ANDROID_SDK_ROOT/ndk/28.0.12433566/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          LLVM_READELF="$ANDROID_SDK_ROOT/ndk/28.0.12433566/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$AAPT"
          test -x "$ZIPALIGN"
          test -x "$LLVM_OBJDUMP"
          test -x "$LLVM_READELF"

          "$AAPT" dump badging "$RELEASE_APK" > "$RUNNER_TEMP/release-badging.txt"
          grep -F "package: name='com.bilgilimedia.mobile' versionCode='23' versionName='1.4.9'" "$RUNNER_TEMP/release-badging.txt"
          grep -F "sdkVersion:'26'" "$RUNNER_TEMP/release-badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/release-badging.txt"

          # Android's official ZIP packaging check for 16 KB page-size support.
          "$ZIPALIGN" -c -P 16 -v 4 "$RELEASE_APK"

          # Verify the AAB itself requests 16 KB page alignment.
          BUNDLETOOL="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error             --output "$BUNDLETOOL"             "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL" | sha256sum --check -
          java -jar "$BUNDLETOOL" dump config --bundle="$RELEASE_AAB" > "$RUNNER_TEMP/bundle-config.txt"
          grep -F "PAGE_ALIGNMENT_16K" "$RUNNER_TEMP/bundle-config.txt"

          # Android's official ELF inspection tools: llvm-objdump + llvm-readelf.
          RELEASE_APK="$RELEASE_APK"           LLVM_OBJDUMP="$LLVM_OBJDUMP"           LLVM_READELF="$LLVM_READELF"           python3 <<'PY'
          import os
          import re
          import subprocess
          import tempfile
          import zipfile

          apk = os.environ["RELEASE_APK"]
          objdump = os.environ["LLVM_OBJDUMP"]
          readelf = os.environ["LLVM_READELF"]

          with zipfile.ZipFile(apk) as archive:
              native_entries = [
                  name for name in archive.namelist()
                  if name.startswith(("lib/arm64-v8a/", "lib/x86_64/"))
                  and name.endswith(".so")
              ]

              with tempfile.TemporaryDirectory() as tmp:
                  for name in native_entries:
                      output = os.path.join(tmp, name.replace("/", "_"))
                      with open(output, "wb") as handle:
                          handle.write(archive.read(name))

                      objdump_text = subprocess.check_output(
                          [objdump, "-p", output], text=True
                      )
                      load_alignments = [
                          int(match.group(1))
                          for line in objdump_text.splitlines()
                          if (match := re.search(r"^\s*LOAD\s+.*\balign 2\*\*(\d+)\s*$", line))
                      ]
                      if not load_alignments:
                          raise SystemExit(f"No ELF LOAD segments found in {name}")
                      if min(load_alignments) < 14:
                          raise SystemExit(
                              f"{name}: LOAD alignment below 2**14: {load_alignments}"
                          )

                      readelf_text = subprocess.check_output(
                          [readelf, "-Wl", output], text=True
                      )
                      relro_lines = [
                          line.strip()
                          for line in readelf_text.splitlines()
                          if line.strip().startswith("GNU_RELRO")
                      ]
                      for line in relro_lines:
                          fields = line.split()
                          if len(fields) < 6:
                              raise SystemExit(f"{name}: cannot parse GNU_RELRO: {line}")
                          virt_addr = int(fields[2], 16)
                          mem_size = int(fields[5], 16)
                          if (virt_addr + mem_size) % 0x4000 != 0:
                              raise SystemExit(
                                  f"{name}: GNU_RELRO end is not 16 KB aligned: {line}"
                              )

                      print(
                          f"{name}: LOAD >= 2**14; "
                          + ("RELRO 16 KB aligned" if relro_lines else "no RELRO segment")
                      )

          if not native_entries:
              print("No arm64-v8a/x86_64 native libraries; ELF check not applicable.")
          PY

          echo "QA APK bytes: $(stat -c%s "$DEBUG_APK")"
          echo "Release APK bytes: $(stat -c%s "$RELEASE_APK")"
          echo "Production AAB bytes: $(stat -c%s "$RELEASE_AAB")"

      - name: Upload Android candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BilgiliMedia-Android-1.4.9-final-parity-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            android-production/app/build/outputs/apk/debug/*.apk
            android-production/app/build/outputs/apk/release/*.apk
            android-production/app/build/outputs/bundle/release/*.aab
            android-production/app/build/reports/lint-results-release.html
            android-production/app/build/reports/lint-results-release.txt
