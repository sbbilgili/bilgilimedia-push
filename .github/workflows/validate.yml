name: Validate repository

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate content and configuration
        run: node scripts/validate-content.js

      - name: Validate push script without credentials
        run: node scripts/check-feed.js

      - name: Build static article pages
        shell: bash
        run: |
          cp content/feed.json hosting/feed.json
          node scripts/build-web-content.js
