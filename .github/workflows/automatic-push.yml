name: BilgiliMedia Automatic Push

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/feed.json"
      - "hosting/app-config.json"
      - "scripts/check-feed.js"
      - ".github/workflows/automatic-push.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: bilgilimedia-automatic-push
  cancel-in-progress: false

jobs:
  check-and-notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/190776938532/locations/global/workloadIdentityPools/github-actions/providers/bilgilimedia-push
          service_account: firebase-adminsdk-fbsvc@bilgilimedia-60d6f.iam.gserviceaccount.com
          project_id: bilgilimedia-60d6f

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Verify Firebase Admin ADC
        shell: bash
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");
          admin.credential.applicationDefault().getAccessToken()
            .then((token) => {
              if (!token || !token.access_token) {
                throw new Error("No Google OAuth access token returned");
              }
              console.log("Firebase Admin ADC token acquisition succeeded.");
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Check repository feed and send topic push
        run: node scripts/check-feed.js

      - name: Save content state
        shell: bash
        run: |
          if git diff --quiet -- state/known.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "BilgiliMedia Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/known.json
          git commit -m "Update automatic push content state"
          git pull --rebase origin main
          git push
