name: BilgiliMedia Automatic Push

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "content/feed.json"
      - "hosting/app-config.json"
      - "scripts/check-feed.js"
      - ".github/workflows/automatic-push.yml"

permissions:
  contents: write

concurrency:
  group: bilgilimedia-automatic-push
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check Firebase secret
        id: secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not configured yet. Push check skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check repository feed and send topic push
        if: steps.secret.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-feed.js

      - name: Save content state
        if: steps.secret.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- state/known.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "BilgiliMedia Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/known.json
          git commit -m "Update automatic push content state"
          git pull --rebase origin main
          git push
