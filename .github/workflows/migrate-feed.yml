name: Migrate BilgiliMedia Feed

on:
  push:
    paths:
      - ".github/workflows/migrate-feed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot current trusted hosted feed
        shell: bash
        run: |
          mkdir -p content
          curl --fail --silent --show-error --location \
            "https://bilgilimedia-60d6f.web.app/feed.json?migration=20261024" \
            -o content/feed.json
          node -e "const f=require('./content/feed.json'); if(!Array.isArray(f.articles)||f.articles.length<1) process.exit(1); console.log('Migrated feed:', f.version, f.articles.length)"
      - name: Commit migrated feed
        shell: bash
        run: |
          git config user.name "BilgiliMedia Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/feed.json
          if git diff --cached --quiet; then
            echo "Feed already migrated."
            exit 0
          fi
          git commit -m "Migrate live content feed into repository"
          git push
